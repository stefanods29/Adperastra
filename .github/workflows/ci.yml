name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Verification scope
        type: choice
        default: full
        options: [quick, full]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Reuse compiled dependencies and the audit tools between runs.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: adperastra
          cache-on-failure: true

      - name: Cache developer audit tools
        id: audit-tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\AdperastraDevTools
          key: audit-tools-cargo-audit-0.22.2-cargo-deny-0.20.2

      - name: Install pinned developer audit tools
        if: steps.audit-tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:LOCALAPPDATA 'AdperastraDevTools'
          cargo install cargo-audit --version 0.22.2 --locked --root $toolRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install cargo-deny --version 0.20.2 --locked --root $toolRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run the same verification as the development PC
        shell: pwsh
        run: |
          $mode = '${{ github.event_name == 'schedule' && 'full' || inputs.mode || 'quick' }}'
          .\scripts\test-all.ps1 -Mode $mode

      - name: Upload verification report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: build/verification/
          if-no-files-found: warn

      # A developer app build, not the public portable/installer release.
      # Public release packaging and install tests arrive in Step 08d.
      - name: Package developer app artifact
        shell: pwsh
        run: |
          # The runtime test build has a debugging port; never package that one.
          npx -y @tauri-apps/cli@2 build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'adperastra-developer-app'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release\Adperastra.exe') -Destination $out
          Copy-Item -LiteralPath help -Destination $out -Recurse
          Copy-Item -LiteralPath dependencies.json -Destination $out
          Set-Content -LiteralPath (Join-Path $out 'README.txt') -Value 'Developer app build for verification. This is not an installer or a public portable release. Requires Windows 11 and WebView2.'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath adperastra-developer-app.zip

      - name: Upload developer app artifact
        uses: actions/upload-artifact@v4
        with:
          name: adperastra-developer-app
          path: adperastra-developer-app.zip

