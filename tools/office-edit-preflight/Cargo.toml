[package]
name = "ooxml-editor-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "confined-office-protocol"
path = "windows/confined_protocol.rs"
required-features = ["windows-preflight"]

[features]
windows-preflight = ["dep:windows"]

[dependencies]
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

uuid = { version = "=1.29.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops"] }

