[package]
name = "archive"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fs-service = { path = "../fs-service" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zip = { version = "9.1", default-features = false, features = ["deflate", "deflate64", "ppmd", "zstd"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "ppmd"] }
tar = "0.4"
flate2 = "1.1"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time", "Win32_Storage_FileSystem"] }
