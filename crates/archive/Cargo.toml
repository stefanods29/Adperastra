[package]
name = "archive"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fs-service = { path = "../fs-service" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# The ZipCrypto extension is explicitly unstable across patch versions, so
# the exact patch is pinned (Step 06e D1).
zip = { version = "=9.1.3", default-features = false, features = ["deflate", "deflate64", "ppmd", "zstd", "aes-crypto", "bzip2"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "ppmd", "compress", "bzip2"] }
tar = "0.4"
flate2 = "1.1"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
bzip2 = "0.6.1"
blake3 = "1.8"

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time", "Win32_Storage_FileSystem"] }
