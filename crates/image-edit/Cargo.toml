[package]
name = "image-edit"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zstd = "0.14"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "9.1", default-features = false, features = ["deflate"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
