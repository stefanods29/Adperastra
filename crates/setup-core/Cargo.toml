[package]
name = "setup-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
