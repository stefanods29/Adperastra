[package]
name = "locked-store"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encrypted locked-folder containers for Adperastra (Step 09k)"

[dependencies]
age = { version = "=0.11.5", default-features = false }
zeroize = "=1.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zip = { version = "9.1", default-features = false }
fs-service = { path = "../fs-service" }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
