[package]
name = "data-views"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fs-service = { path = "../fs-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
mail-parser = "=0.11.9"
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
