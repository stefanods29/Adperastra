[package]
name = "search-index"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fs-service = { path = "../fs-service" }
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
notify = "8.2.1"

[dev-dependencies]
tempfile = "3"
