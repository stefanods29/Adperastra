[package]
name = "pack-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fs-service = { path = "../fs-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
minisign = "0.8"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls-native-roots"], default-features = false }

[dev-dependencies]
tempfile = "3"
