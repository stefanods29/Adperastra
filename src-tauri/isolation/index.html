<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Adperastra Isolation</title>
  </head>
  <body>
    <script>
      // Tauri 2 isolation hook: receives the IPC payload object
      // ({ cmd, callback, error, payload, options }) and must return it
      // unchanged for allowed calls. Throwing blocks the call entirely:
      // the payload handler in Tauri's isolation runtime awaits this hook
      // before encrypting/sending, so a throw means nothing reaches Core.
      (function () {
        var ALLOWED = new Set([
          'get_settings', 'set_maximize_rect',
          'save_settings',
          'get_session',
          'save_session',
          'list_help',
          'get_help_page',
          'search_help',
          'get_windows_accent',
          'open_help_window',
          'list_dir_start', 'list_dir_poll', 'list_dir_cancel', 'fs_stat',
          'list_known_folders', 'list_drives', 'drive_info',
          'list_recent_items', 'explorer_state_get',
          'pin_folder', 'unpin_folder', 'record_recent_folder',
          'watch_start', 'watch_stop',
          'item_details', 'rename_item',
          'check_conflicts', 'create_item', 'create_text_file', 'file_op_start', 'file_op_poll', 'file_op_cancel',
          'add_favorite', 'remove_favorite', 'list_favorite_items',
          'open_item', 'open_with_dialog', 'show_properties', 'open_in_terminal',
          'share_items', 'show_classic_menu',
          'clipboard_set_files', 'clipboard_read', 'clipboard_text', 'clipboard_image_file', 'clipboard_clear', 'start_external_drag', 'create_shortcut',
          'file_detect', 'file_grant', 'file_revoke', 'open_external_url', 'file_unblock', 'media_sidecars',
          'folder_views_get', 'folder_view_set', 'folder_views_clear',
          'appearance_set_zoom', 'settings_export', 'settings_import',
          'text_save', 'text_pick_save_path',
          'versions_list', 'versions_extract', 'versions_restore', 'versions_save_copy', 'versions_delete_all', 'versions_store_size',
          'recovery_write', 'recovery_read', 'recovery_delete',
          'job_poll', 'job_cancel',
          'file_identity', 'cache_usage', 'cache_clear', 'cache_release',
          'background_status', 'thumbnail_request_start', 'thumbnail_lookup', 'thumbnail_release',
          'gallery_start', 'gallery_page', 'gallery_close', 'gallery_active', 'gallery_pick_source',
          'metadata_read_start', 'metadata_release',
          'preview_detect', 'preview_grant', 'preview_revoke',
          'archive_open_start', 'archive_folder', 'archive_search', 'archive_close',
          'archive_open_entry_start', 'archive_extract_start', 'archive_pick_folder',
          'archive_rar_status', 'archive_create_start',
          'templates_list', 'template_create', 'template_create_start', 'templates_pick_folder',
          'table_open_start', 'table_view_start', 'table_rows', 'table_close',
          'json_open_start', 'json_children', 'json_find', 'json_copy', 'json_close',
          'font_info_start', 'font_install'
        ]);
        // Core commands used by the JS window/event APIs we grant in
        // capabilities/main.json (plugin:window|*, plugin:event|*).
        function isCoreAllowed(cmd) {
          return (
            cmd.indexOf('plugin:window|') === 0 ||
            cmd.indexOf('plugin:event|') === 0 ||
            cmd.indexOf('plugin:webview|') === 0
          );
        }
        window.__TAURI_ISOLATION_HOOK__ = function (payload) {
          if (!payload || typeof payload !== 'object' || typeof payload.cmd !== 'string') {
            throw new Error('isolation: malformed IPC payload');
          }
          if (ALLOWED.has(payload.cmd) || isCoreAllowed(payload.cmd)) {
            return payload;
          }
          throw new Error('isolation: blocked IPC command ' + payload.cmd);
        };
      })();
    </script>
  </body>
</html>
