[package]
name = "adperastra-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Adperastra main application (Tauri 2 backend)"

[[bin]]
name = "Adperastra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = { version = "0.61", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
] }
