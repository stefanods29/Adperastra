[package]
name = "adperastra-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Adperastra main application (Tauri 2 backend)"

[[bin]]
name = "Adperastra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs-service = { path = "../crates/fs-service" }
cache-store = { path = "../crates/cache-store" }
archive = { path = "../crates/archive" }
version-store = { path = "../crates/version-store" }
thiserror = "2"
infer = "0.22"
data-views = { path = "../crates/data-views" }
# Font details are read in the font helper process (Step 06f).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1.8"
# Gallery source watchers (Step 07c); same locked version as fs-service.
notify = "8"
# Step 07d: memory sinks, framed-pipe hashes, the private-profile preflight.
zeroize = "1.9.1"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
sha2 = "0.10"
webview2-com = "=0.39.1"
windows-core-webview = { package = "windows-core", version = "=0.62.2", default-features = true }
windows-collections = "0.2"
windows-core = "=0.61.2"
windows = { version = "0.61", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_System_Diagnostics_Debug",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"
