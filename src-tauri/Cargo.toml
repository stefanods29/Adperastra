[package]
name = "adperastra-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Adperastra main application (Tauri 2 backend)"

[[bin]]
name = "Adperastra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs-service = { path = "../crates/fs-service" }
thiserror = "2"
windows-collections = "0.2"
windows = { version = "0.61", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_System_Diagnostics_Debug",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
