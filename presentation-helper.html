<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Step 22a D8: audience helper CSP. Same strict policy as the PDF
         helper: packaged assets and the helper's own guarded adpfile routes
         only. No remote content, no eval, no inline script, no frames. -->
    <title>Adperastra presentation</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #presentation-root { position: fixed; inset: 0; display: grid; place-items: center; }
      #presentation-canvas { max-width: 100%; max-height: 100%; background: #000; }
    </style>
  </head>
  <body>
    <div id="presentation-root">
      <canvas id="presentation-canvas" width="1280" height="720" aria-label="Presentation"></canvas>
    </div>
    <script type="module" src="/src/presentation-helper/main.ts"></script>
  </body>
</html>
